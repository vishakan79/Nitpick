server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
spring:
  application:
    name: nitpick-api
  datasource:
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  flyway:
    enabled: true
  main:
    lazy-initialization: false
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
