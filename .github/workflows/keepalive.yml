name: Keep API awake

# Render's free plan puts the API to sleep after 15 minutes without traffic, and a cold start takes about a
# minute. GitHub gives webhooks only 10 seconds, so a sleeping API misses pull requests. Pinging every 10
# minutes keeps it warm. (An external monitor such as UptimeRobot pointed at the same URL works too.)

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: curl -fsS --retry 3 --retry-delay 20 --max-time 120 https://nitpick-api.onrender.com/actuator/health
